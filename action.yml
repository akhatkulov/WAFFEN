name: 'WAFFEN WAF Bypass Test'
description: 'Run WAFFEN WAF bypass testing against a staging target as a CI gate'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  target:
    description: 'Target URL (e.g., https://staging.example.com)'
    required: true
  path:
    description: 'Request path on target'
    default: '/'
  param:
    description: 'Parameter name to inject into'
    default: 'q'
  class:
    description: 'Attack class: sqli, xss, ssti, or all-classes'
    default: 'sqli'
  max-requests:
    description: 'Request budget per search run'
    default: '200'
  block-signature:
    description: 'WAF block page signature string (for calibration)'
    default: ''
  fail-on-bypass:
    description: 'Fail the CI step if a verified bypass is found'
    default: 'true'
  sarif:
    description: 'Write SARIF report to this path (for GitHub Security tab)'
    default: ''
outputs:
  findings:
    description: 'Total number of findings (through payloads)'
    value: ${{ steps.evaluate.outputs.findings }}
  verified:
    description: 'Number of verified-exploitable bypasses'
    value: ${{ steps.evaluate.outputs.verified }}
  result:
    description: 'pass or fail'
    value: ${{ steps.evaluate.outputs.result }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install WAFFEN
      run: pip install -e "${{ github.action_path }}"
      shell: bash
    - name: Run bypass search
      run: |
        ARGS="--target ${{ inputs.target }}"
        ARGS="$ARGS --path ${{ inputs.path }}"
        ARGS="$ARGS --param ${{ inputs.param }}"
        ARGS="$ARGS --max-requests ${{ inputs.max-requests }}"
        ARGS="$ARGS --calibrate --verify --stop-on-first"
        ARGS="$ARGS --out waffen-results.jsonl"
        if [ -n "${{ inputs.block-signature }}" ]; then
          ARGS="$ARGS --block-signature \"${{ inputs.block-signature }}\""
        fi
        if [ -n "${{ inputs.sarif }}" ]; then
          ARGS="$ARGS --sarif ${{ inputs.sarif }}"
        fi
        if [ "${{ inputs.class }}" = "all-classes" ]; then
          ARGS="$ARGS --all-classes"
        else
          ARGS="$ARGS --class \"${{ inputs.class }}\""
        fi
        eval waffen bypass $ARGS || true
      shell: bash
    - name: Evaluate results
      id: evaluate
      run: |
        python3 -c "
        import json, sys, os
        findings = []
        try:
            with open('waffen-results.jsonl') as f:
                for line in f:
                    if line.strip():
                        d = json.loads(line)
                        findings.extend(d.get('findings', []))
        except FileNotFoundError:
            pass
        verified = [f for f in findings if f.get('verified_exploitable')]
        total = len(findings)
        n_verified = len(verified)
        result = 'fail' if (verified and '${{ inputs.fail-on-bypass }}' == 'true') else 'pass'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
            gh.write(f'findings={total}\n')
            gh.write(f'verified={n_verified}\n')
            gh.write(f'result={result}\n')
        if verified:
            print(f'::error::WAFFEN found {n_verified} verified WAF bypass(es) out of {total} findings')
            for v in verified[:5]:
                print(f'  - {v.get(\"attack_class\",\"?\")} : {v.get(\"payload\",\"?\")[:60]}')
        else:
            print(f'WAFFEN: {total} findings, 0 verified bypasses — WAF holds')
        if result == 'fail':
            sys.exit(1)
        "
      shell: bash
