name: 'WAFFEN WAF Bypass Test'
description: 'Run WAFFEN WAF bypass testing against a staging target as a CI gate'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  target:
    description: 'Target URL (e.g., https://staging.example.com)'
    required: true
  path:
    description: 'Request path on target'
    default: '/'
  param:
    description: 'Parameter name to inject into'
    default: 'q'
  class:
    description: 'Attack class: sqli, xss, ssti, or all-classes'
    default: 'sqli'
  max-requests:
    description: 'Request budget per search run'
    default: '200'
  block-signature:
    description: 'WAF block page signature string (for calibration)'
    default: ''
  fail-on-bypass:
    description: 'Fail the CI step if a verified bypass is found'
    default: 'true'
  sarif:
    description: 'Write SARIF report to this path (for GitHub Security tab)'
    default: ''
outputs:
  findings:
    description: 'Total number of findings (through payloads)'
    value: ${{ steps.evaluate.outputs.findings }}
  verified:
    description: 'Number of verified-exploitable bypasses'
    value: ${{ steps.evaluate.outputs.verified }}
  result:
    description: 'pass or fail'
    value: ${{ steps.evaluate.outputs.result }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install WAFFEN
      run: pip install -e "${{ github.action_path }}"
      shell: bash
    - name: Run bypass search
      env:
        WAFFEN_TARGET: ${{ inputs.target }}
        WAFFEN_PATH: ${{ inputs.path }}
        WAFFEN_PARAM: ${{ inputs.param }}
        WAFFEN_CLASS: ${{ inputs.class }}
        WAFFEN_MAX_REQUESTS: ${{ inputs.max-requests }}
        WAFFEN_BLOCK_SIG: ${{ inputs.block-signature }}
        WAFFEN_SARIF: ${{ inputs.sarif }}
      run: |
        ARGS=(
          --target "$WAFFEN_TARGET"
          --path "$WAFFEN_PATH"
          --param "$WAFFEN_PARAM"
          --max-requests "$WAFFEN_MAX_REQUESTS"
          --calibrate --verify --stop-on-first
          --out waffen-results.jsonl
        )
        if [ -n "$WAFFEN_BLOCK_SIG" ]; then
          ARGS+=(--block-signature "$WAFFEN_BLOCK_SIG")
        fi
        if [ -n "$WAFFEN_SARIF" ]; then
          ARGS+=(--sarif "$WAFFEN_SARIF")
        fi
        if [ "$WAFFEN_CLASS" = "all-classes" ]; then
          ARGS+=(--all-classes)
        else
          ARGS+=(--class "$WAFFEN_CLASS")
        fi
        waffen bypass "${ARGS[@]}" || true
      shell: bash
    - name: Evaluate results
      id: evaluate
      env:
        FAIL_ON_BYPASS: ${{ inputs.fail-on-bypass }}
      run: |
        python3 -c "
        import json, sys, os
        findings = []
        try:
            with open('waffen-results.jsonl') as f:
                for line in f:
                    if line.strip():
                        d = json.loads(line)
                        findings.extend(d.get('findings', []))
        except FileNotFoundError:
            pass
        verified = [f for f in findings if f.get('verified_exploitable')]
        total = len(findings)
        n_verified = len(verified)
        fail_on = os.environ.get('FAIL_ON_BYPASS', 'true')
        result = 'fail' if (verified and fail_on == 'true') else 'pass'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
            gh.write(f'findings={total}\n')
            gh.write(f'verified={n_verified}\n')
            gh.write(f'result={result}\n')
        if verified:
            print(f'::error::WAFFEN found {n_verified} verified WAF bypass(es) out of {total} findings')
            for v in verified[:5]:
                cls = v.get('attack_class', '?')
                pay = v.get('payload', '?')[:60]
                print(f'  - {cls} : {pay}')
        else:
            print(f'WAFFEN: {total} findings, 0 verified bypasses — WAF holds')
        if result == 'fail':
            sys.exit(1)
        "
      shell: bash
