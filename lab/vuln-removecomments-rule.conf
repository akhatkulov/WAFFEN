# Isolation probe for CVE-2026-104259 (ModSecurity t:removeComments off-by-one).
#
# "blockedtoken" is NOT SQL, so CRS / libinjection never fire on it (verified: a
# lone /**/ without SQL keywords is 200 at PL1). This one custom rule is therefore
# the ONLY thing that can block the request, and it blocks only if t:removeComments
# correctly collapses the comment(s) between the two halves so "@rx blockedtoken"
# matches:
#   blocked/**/token      -> removeComments -> "blockedtoken"  -> match  -> 403 (both engines)
#   blocked/**//**/token  -> patched >=3.0.17: -> "blockedtoken" -> match -> 403
#                         -> vulnerable <=3.0.16: off-by-one leaves a broken token
#                            -> no match -> request PASSES (the CVE-2026-104259 bypass)
SecRule ARGS:q "@rx (?i)blockedtoken" \
    "id:9999001,phase:2,deny,status:403,t:none,t:removeComments,\
    msg:'WAFFEN removeComments isolation probe (CVE-2026-104259)'"
