user www-data;
worker_processes auto;
daemon off;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/naxsi_core.rules;   # NAXSI whitelist/scoring detection rules (http ctx)
    default_type application/octet-stream;
    server {
        listen 8080;
        server_name _;
        location / {
            SecRulesEnabled;                 # enforce (not LearningMode) -> NAXSI blocks on score
            DeniedUrl "/RequestDenied";
            CheckRule "$SQL >= 8" BLOCK;
            CheckRule "$RFI >= 8" BLOCK;
            CheckRule "$TRAVERSAL >= 4" BLOCK;
            CheckRule "$EVADE >= 4" BLOCK;
            CheckRule "$XSS >= 8" BLOCK;
            CheckRule "$UPLOAD >= 5" BLOCK;
            proxy_pass http://waffen-lab-juiceshop:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /RequestDenied {
            return 403 "NAXSI: request blocked by WAF\n";
        }
    }
}
