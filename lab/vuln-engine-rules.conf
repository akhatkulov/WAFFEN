# Isolation probes for the 2026 ModSecurity transformation CVEs. Both rules match
# the non-SQL token "blockedtoken", so CRS / libinjection never fire on them — each
# rule is the ONLY thing that can block its request, and it blocks only if the
# transformation behaves correctly. Run on a vulnerable (<=3.0.16) and a patched
# (>=3.0.17) engine for a version-differential. See docs/VALIDATION.md §7.1 / §7.4.

# CVE-2026-104259 — t:removeComments off-by-one.
#   blocked/**/token      -> "blockedtoken"  -> 403 (both)
#   blocked/**//**/token  -> 403 patched / 200 vulnerable (adjacent comment survives)
SecRule ARGS:q "@rx (?i)blockedtoken" \
    "id:9999001,phase:2,deny,status:403,t:none,t:removeComments,\
    msg:'WAFFEN removeComments isolation probe (CVE-2026-104259)'"

# GHSA-4j47-8qcr-jf59 — t:base64DecodeExt discards the whole buffer on a malformed
# single-char padding group.
#   <base64 'blockedtoken'>        -> decodes to "blockedtoken"      -> 403 (both)
#   A==<base64 'blockedtoken'>     -> patched: keeps bytes after the bad group,
#                                      still contains "blockedtoken" -> 403
#                                  -> vulnerable: blanks the whole value -> "" -> 200
SecRule ARGS:q "@rx (?i)blockedtoken" \
    "id:9999002,phase:2,deny,status:403,t:none,t:base64DecodeExt,\
    msg:'WAFFEN base64DecodeExt isolation probe (GHSA-4j47-8qcr-jf59)'"
